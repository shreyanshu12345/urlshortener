<!DOCTYPE html>
<html>
<head>
    <title>Go URL Shortener</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />




    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen;
            background: linear-gradient(135deg, #667eea, #764ba2);

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh; 
            padding: 20px;     
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px; 
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 30px;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px; /* cleaner spacing */
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            outline: none;
            transition: border 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: #667eea;
        }

        button {
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #667eea;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #5a67d8;
        }

        .result {
            margin-top: 20px;
            padding: 12px;
            background: #f3f4f6;
            border-radius: 8px;
            word-break: break-word;
        }

        .result a {
            text-decoration: none;
            color: #667eea;
            font-weight: 500;
        }

        .result a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>URL Shortener</h1>

    <form action="/shorten" method="POST">
        <input type="text" name="url" placeholder="Enter your long URL..." required />
        <button type="submit">Shorten URL</button>
    </form>

    {{if .ShortURL}}
        <div class="result">
            <strong>Your Short URL:</strong><br/>
            <a href="{{.ShortURL}}" target="_blank">{{.ShortURL}}</a>
        </div>
    {{end}}

</div>

</body>
</html>
